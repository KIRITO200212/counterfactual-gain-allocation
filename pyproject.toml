[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regcfpo"
version = "0.1.0"
description = "Reproducible branch-allocation and answer-supervision studies in spatial vision-language models"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.4",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-cov==6.0.0",
  "ruff==0.11.2",
]
analysis = [
  "pandas==2.2.3",
  "scipy==1.15.2",
  "matplotlib==3.10.1",
]
vlm = [
  "transformers==4.49.0",
  "qwen-vl-utils==0.0.10",
  "accelerate==1.5.2",
  "safetensors==0.5.3",
  "huggingface-hub==0.29.3",
  "pillow==11.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

