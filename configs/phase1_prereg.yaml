    - full option text
    - full-template teacher-forced answer span
    - full CoT rollout frequency
  thresholds: {factual_top1_min: 0.90, sign_agreement_min: 0.85, spearman_min: 0.80}
  fallback_on_failure: auxiliary loss uses full-template answer-span scores

locator_policy_v2:
  training_time_operands: SpatialLadder Stage-1 grounding annotations as privileged boxes
  rationale: >-
    Boxes are part of the released curriculum, not external data; they are
    used only to generate training-time counterfactuals; the final model
    needs no boxes or locator at test time.
  theta0_self_locator_role: ablation and replaceability note only; does not block smoke

relation_pair_v3:
  status: protocol_preregistered
  authority: results/phase1/phase1_plan.md section 8; phase0_suggestion PART 2
  relations_axis: [left, right]
  relations_diagonal: [left-front, right-front, left-back, right-back]
  relations_excluded: [front, back]
  exclusion_reason: >-
    pure front/back have no horizontal component and depth cannot be
    manipulated by a 2D box swap
  swap_mapping_rule: point_reflection_of_center_offsets
  swap_mapping:
    left: right
    right: left
    left-front: right-back
    right-back: left-front
    left-back: right-front
    right-front: left-back
  mapping_status_axis: validated_by_confirmation_gate
  mapping_status_diagonal: hypothesis_requiring_unseen_scene_validation
  diagonal_validation:
    design: >-
      frozen pixel operator graph run on a newly drawn development subset
      from never-viewed base scenes only; criterion LCB95 of scene-bootstrap
      G_res > 0 before diagonal rows may enter any training manifest
    consumes_new_scenes: true
  data_rules:
    join_key: [question_id, image, data_type]
    join_key_unique_hard_assertion: true
    x_center_equal_policy: explicit_reject_relation_undefined
    entity_span_rule: boundary-aware unique non-overlapping spans (v2 rule)
    scene_key: strip_trailing_trajectory_suffix
  split_policy:
    viewed_scenes_definition: >-
      every base scene whose model outputs have ever been inspected is
      development lineage and can never enter formal train/test
    viewed_scenes_current: 148 diagnostic base scenes
    one_shot_freeze: true
    targets: train 800-1000 operator-valid prompts and >= 250 train scenes
    shortfall_policy: >-
      if targets are unreachable, adjust only via a documented power-analysis
      amendment; never reuse viewed scenes and never silently loosen filters

secondary_control_dual_query:
  status: preregistered
  definition: >-
    For the identical swapped image, the original question asks A relative to
    B and expects the mapped relation, while the dual question asks B relative
    to A and expects the original relation. Agreement of both directions on
    the same edited image evidences object-identity and relation reading
    rather than an undirected response to visual disruption.
  role: secondary robustness control; cannot replace the resampling null
  applies_to: confirmation re-analysis and training-time diagnostics

