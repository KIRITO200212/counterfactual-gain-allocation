confirmation_gate_447:
  authorized: true
  authorized_on: "2026-08-20"
  authority: results/phase1/phase1_plan2.md
  primary_statistic: G_res_scene_bootstrap_lcb95
  primary_endpoint: >-
    LCB95 of scene-level bootstrap E[G_res] > 0, where
    G_res = s(I_swap) - s(I_resampling) on mutually accepted eligible rows
  cd_policy: >-
    A+ policy: genuine C/D keeps its frozen selection rule; runs where
    available; if fewer than ~25 independent scenes remain, G_robust is
    reported as NOT ESTIMABLE and no context-mismatch-exclusion claim is made
  secondary_endpoints:
    - execution_acceptance_on_eligible_min_0_95
    - dca_swap_greater_than_dca_resampling_with_positive_scene_bootstrap_ci
    - resampling_null_factual_retention_and_no_systematic_mapped_rise
    - directional_decomposition_original_down_and_mapped_up
    - support_stratification_lt2_2to4_ge4_consistency_and_scene_influence
  support_strata: ["lt2", "2_to_lt4", "ge4"]
  bootstrap_seed: 20270818
  bootstrap_resamples: 10000
  no_interim_inspection: true
  no_threshold_retuning_after_failure: true
  reserve_invisible: true

analysis_integrity_v2:
  status: preregistered
  amendment_id: analysis_integrity_and_diagonal_disambiguation_20260820
  influence_estimator: >-
    scene-weighted mean of per-scene G_res for both the full estimate and
    every leave-one-scene/family-out estimate; row-weighted means are
    reported only as explicitly labeled descriptive statistics
  legal_recompute_rule: >-
    old readout artifacts are never modified; v2 outputs are new files
    (analysis_contract_v2.json, *_v2.json, reconciliation report); input
    JSONL hashes must equal the old artifacts; the new script hash is
    pinned; the confirmation contract hash is verified; shared endpoints
    must reconcile item by item; if only influence values change the old
    influence numbers are marked superseded and gates stand; any material
    change to primary endpoints pauses all downstream work
  metric_naming:
    eligibility_coverage: eligible_rows / all_rows
    runtime_completion_rate_among_eligible: executed / eligible (code sanity only)
  power_analysis_wording: >-
    The subsampling analysis demonstrates stability of the observed operator
    signal under scene subsampling; it is not prospective power for
    post-training benchmark gains.

diagonal_composition_gate:
  status: preregistered
  supersedes_scope_of: diagonal_compatibility_gate (binary result retained)
  population: the same 335 eligible viewed diagonal rows over 86 scenes
  candidates:
    r00: original relation (h, d)
    r10: horizontal-only flip (-h, d)
    r01: depth-only flip (h, -d)
    r11: full point reflection (-h, -d)
  scoring: >-
    length-normalized log-likelihood over the question's own four relation
    options; if a question lacked the vocabulary a fixed canonical template
    would be used and folded into the proxy audit; the released diagonal
    option sets already contain all four relations
  branches: [factual, pixel_pair_slot_swap, canonical_resampling_return]
  statistics:
    M_full_swap: l_swap(r11) - max(l_swap(r00), l_swap(r10), l_swap(r01))
    G_H: "[l_swap(r11)-l_swap(r01)] - [l_null(r11)-l_null(r01)]"
    G_D: "[l_swap(r11)-l_swap(r10)] - [l_null(r11)-l_null(r10)]"
  criteria:
    - G_H scene-bootstrap LCB95 > 0
    - G_D scene-bootstrap LCB95 > 0
    - r11 four-candidate top-1 rate under swap significantly above null
    - G_D positive for both diagonal families, ideally each CI excluding 0
    - r00 remains the main answer under the null
    - no domination by one family or few scenes
  fail_rule: >-
    if horizontal passes but depth fails, the diagonal mapping may not enter
    training; axis-only training on 23 rows is prohibited; the lawful
    branches are pausing formal training or redesigning a horizontal-only
    operator for a later window
  wording_until_pass: >-
    binary point-inversion compatibility was confirmed; component-wise
    disambiguation remains pending

dual_query_secondary_control:
  status: preregistered_execution_ordered
  design: >-
    On the identical edited image, the original question (A relative to B)
    expects the mapped relation after swap and the original relation under
    null; the dual question (B relative to A, entity spans exchanged in the
    frozen question template) expects the original relation after swap and
    the swap-mapping inverse under null
  reports:
    - per-question DCA for both directions
    - joint consistency probability
    - cycle consistency
    - swap-minus-null differences
    - axis and diagonal reported separately
    - candidate token ids recorded
  role: secondary consistency evidence; never replaces the composition gate

distortion_robustness_gate:
  status: preregistered
  timing: before the final split freeze
  population: 291 axis confirmation rows (recorded geometry + changed pixels)
  covariates:
    - source-to-target width scale
    - height scale
    - area scale
    - aspect distortion
    - A/B size ratio
    - actual changed-pixel ratio
    - token support
    - union area
  analyses:
    - scene-bootstrap tertile strata
    - lowest-distortion 50 percent subset
    - scene-clustered regression of G_res on distortion/support/union/ratio
    - internal replication of compact H minus V from frozen run artifacts
  labeling: post hoc robustness analysis, reported as such
  keep_operator_rules:
    - low-distortion 50 percent subset G_res strictly positive
    - main distortion strata directionally consistent
    - internally replicated compact H-V CI strictly above 0
  must_revise_rules: >-
    if only high-distortion rows carry the effect: preregister stricter
    training-time distortion eligibility from metadata only and re-audit
    capacity, or add a stronger cross-resize-return null on viewed lineage;
    thresholds may never be tuned against the 52-row final holdout

v3_contract_hardening:
  status: preregistered_blocking_final_split
  items:
    - RelationPairV3 __post_init__ strict validation with fail-closed unknown fields
    - relation/mapped consistency, letter/option-parser consistency, distinct letters
    - box legality, composite key uniqueness, equal x-center rejection, family legality
    - single shared pure eligibility function for all data-layer audits and manifests
    - explicit scene-lineage cross-checks against raw manifests (train/replay/holdout vs viewed and each other)
    - atomic output writes, hash-equal skip, partial-output refusal, ordered unique sample ids
  frozen_hash_policy: >-
    SUPERSEDED 2026-08-27 by amendment
    asymmetric_directional_credit_revision_20260826 (integer_box_overlap added;
    zero of 1843 candidate / 174 train rows affected; new hashes registered in
    the amendment). Original text: "pixel_ops.base_eligibility hash stays
    untouched; the shared function is new code"

final_split_configuration:
  status: preregistered_pending_gates
  gate_preconditions:
    - diagonal_composition_gate PASS
    - distortion_robustness_gate PASS
    - v3_contract_hardening complete
  directional_train: {prompts: 174, scenes: 76, axis: 23, diagonal: 151}
  exposure_scheduler:
    axis_to_diagonal: "1:2"
    rule: >-
      per 3 directional slots take 1 axis and 2 diagonal; scene-uniform
      within each class; at most one prompt per scene per cycle; the two
      diagonal families alternate 1:1; record unique-scene exposure and
      per-prompt repetition counts; never duplicate JSON rows
  final_internal_holdout:
    scenes: 8
    prompts: 52
    axis: 22
    diagonal: 30
    no_reallocation: true
    role: single post-freeze internal check only; main evaluation stays external
  replay_pool:
    total: 174
    buckets:
      multi_view_non_counting_non_direction: 61
      video_non_counting_non_direction: 26
      counting_cross_modality_stratified: 26
      other_single_image_non_counting_non_direction: 61
    selection_priority: [counting, video_non_counting, multi_view_non_counting, single_image_non_counting]
    exclusions: [development, confirmation, diagonal_viewed, final_holdout]
    sampling: scene-uniform; cover distance/size/room-size/appearance-order tasks
  total_mix: directional:replay = 1:1

smoke_and_matrix_scope:
  smoke_seeds: single frozen seed for all 50-step smoke runs
  smoke_matrix: [continued-GRPO, vanilla CFPO, ReG-CFPO]
  engineering_smoke: [continued-GRPO 5-20 steps, ReG-CFPO 5-20 steps, ReG-no-null 5-20 steps, exact save/resume]
  formal_matrix_runs: 8
  formal_seeds: {continued_grpo: 3, regcfpo: 3, vanilla_cfpo: 1, global_duality: 1}
  step_budget_rule: >-
    fixed only by preregistered wall-clock: 300 steps if 8 runs fit ~10-11
    dual-GPU days, else 200 for all methods; never per-method dev tuning
  trainer_constraints:
    - dataset features keep boxes, mapped relation, scene, operator metadata
    - SAT/MIX/ALL_WRONG computed after global reward gather
    - equal auxiliary forward counts across ranks; inactive samples use weight 0, never skipped forwards
    - auxiliary forwards use_cache=False; answer scores keep gradients
    - one swap/null computation per prompt, not per rollout
    - PYTHONNOUSERSITE=1; attn_implementation=sdpa explicit; Qwen config compat before load
    - no automatic checkpoint resume; contract binds model/data/code/seed/optimizer/scheduler/RNG
  equivalence_tests_before_training:
    - gamma=0 ReG trainer identical to continued-GRPO in loss, policy gradient, update, and resume
    - null-only branch produces no mapped-answer directional gradient
    - gate behavior for SAT/MIX/ALL_WRONG and equal rank counts

capacity_power_analysis:
  status: preregistered
  data_source: 447-row confirmation mutually accepted rows (291 rows, 107 scenes)
  method: scene_stratified_subsampling
  scene_candidates: [30, 40, 50, 60, 70]
  repetitions_per_candidate: 2000
  sampling_rule: draw scenes without replacement; keep all eligible prompts of each drawn scene
  internal_bootstrap: scene-level paired bootstrap within each subsample
  bootstrap_seed_derivation: seed = base_seed 20270818 + repetition_index
  success_criteria:
    p_lcb95_gres_gt_0_min: 0.95
    p_dca_swap_gt_null_min: 0.95
  scope_limitation: >-
    This analysis certifies how many scenes stably carry the auxiliary
    directional signal; it does not certify benchmark-gain sample sizes,
    which still require training seeds and external evaluation.
  feasibility_floor:
    directional_train_prompts_min: 160
    independent_train_scenes_min: 60
    relation_family_coverage: required
    replay_ratio: "1:1"
  stop_rule: >-
    if the power analysis demands more scale than the released data can
    provide, stop the no-external-data track instead of lowering the floor

diagonal_compatibility_gate:
  status: preregistered
  authority: results/phase1/phase1_plan3.md decision 2
  lineage: viewed diagnostic scenes only (no unseen scene consumption)
  population: all 335 eligible viewed diagonal rows over 86 scenes
  mapping_under_test: point_reflection (left-front<->right-back, left-back<->right-front)
  tuning_prohibited: true
  thresholds_unchanged: true
  cherry_picking_prohibited: true
  criteria:
    - scene-bootstrap LCB95 of G_res > 0 on the full diagonal population
    - swap DCA greater than resampling-null DCA with positive scene-bootstrap CI
    - resampling-null factual retention high
    - directional decomposition original down and mapped up
    - both relation families (LF/RB and LB/RF) have positive mean effects
    - effect not dominated by one family or few scenes
  pass_consequence: diagonal rows may enter the training pool
  fail_consequence: >-
    axis-only unseen capacity (45 eligible rows) cannot support the ICLR
    training track without external data; stop or defer to a later window.
    Selecting only the better family post-hoc is prohibited unless that
    branch was separately preregistered beforehand.

reserve_reallocation:
  status: preregistered
  trigger: after diagonal compatibility gate passes
  amendment_id: reserve_reallocation_after_operator_confirmation
  metadata_only_inputs:
