  - id: a_plus_plus_screening_authorization_20260831
    recorded_at: "2026-09-01T01:30:00Z"
    type: gate_arbitration_and_confirmatory_spec_freeze
    changes_thresholds: true
    authority: results/phase1/phase1_plan8.md (user verdict A++, 2026-08-31)
    reason: >-
      Gate R0 (2026-08-28) returned FAIL on its directional criteria
      (d_s_swap=-0.000565 <= 0; composition -0.10 < 0.70) while every
      health/composition core criterion passed (g3-g6).  Power analysis on
      the probe artifacts shows the directional criterion is unresolvable
      at the frozen gamma (0.00348) within 20 updates: naive scaling
      predicts +0.0005 vs a row-level SEM of 0.0029 (n=34).  The user
      verdict A++ retains the preregistered FAIL, authorizes the 348-step
      screening, and freezes the full confirmatory spec (estimand, gates,
      branch rules, analyzers) BEFORE any 348-step result is visible.
    verdicts:
      GATE_R0_V1: FAIL_AS_PREREGISTERED
      GATE_R0_V1_EFFICACY_INTERPRETATION: INCONCLUSIVE_UNDERPOWERED
      GATE_R0_HEALTH_CORE_G3_G6: PASS
      AREG_V1_IMPLEMENTATION_PATH: VERIFIED_BY_AUTOGRAD
      AREG_V1_EMPIRICAL_EFFICACY: PENDING_348_STEP_SCREENING
      gate_r0_report: reports/generated/gate_r0_probe_readout.json
      autograd_evidence: >-
        tests/test_areg_autograd_paths.py (9 tests, sha256
        eba6de6628be3f4f2d662ad0ad73a52a9e8098c700c56516dae6989a1b6071f5):
        dL_swap/ds_null == 0, dL_swap/ds_fact == 0 (no such input),
        active/inactive hinge gradients -w_i/n / 0, stop-gradient target,
        preservation-only gradient paths on null/factual/logp_fact_orig,
        theta0 cache requires_grad=False and graph-invisible, weights
        detached, gamma=0 exact-zero identity with exactly-zero grads.
        Scope limit (plan8 section 2.1): direct gradient paths only;
        parameter-level interference through shared weights remains in the
        statistical domain (anchors + 348-step trajectory).
    authorizations:
      SCREENING_348_AUTHORIZED: true
      FORMAL_TRAINING_AUTHORIZED: false
      EXPANDED_SETTING_AUTHORIZED: false
      FINAL_HOLDOUT_VISIBLE: false
    frozen_confirmatory_spec:
      label: AREG_V1_CONFIRMATORY_SPEC_FROZEN_BEFORE_348
      estimand: >-
        DeltaDelta_b(i,t) = [s_b^AReG(i,t) - s_b^AReG(i,0)] -
        [s_b^Cont(i,t) - s_b^Cont(i,0)] per row, branch b in
        {swap, null, fact}; AReG seed k paired with continued seed k
        (respective continued); pooled over both pairs; scene-clustered
        bootstrap.  Single-leg before/after is descriptive only.
      score_unit: mean_per_candidate_token
      candidate_token_count: 7
      training_seeds: [2001, 2002]
      evaluation_seeds: [1701, 1702, 1703]
      scene_bootstrap: {B: 10000, seed: 20260901, alpha_one_sided: 0.05, cluster_unit: scene_id}
      primary_endpoints:
        mechanism: "LCB95(DeltaDelta_s_swap) > 0, both pair points > 0; composition C_swap >= 0.70 only after LCB95(DeltaDelta G_res) > 0"
        behavior: "G=16 rollout log-odds, AReG vs respective continued"
        fidelity: "factual/replay/format non-inferiority vs respective continued, margin 1pt; anchor absolute-logp equivalence CI inside [-0.02, +0.02] token-mean nats"
        external: "M_ext = mean(ViewSpatial overall, CV-Bench COCO, CV-Bench Omni3D, SPBench-SI mca, SPBench-SI na); singles secondary"
      secondary_endpoints:
        behavior: [mapped-majority, mapped rate, net behavioral flips, TF-rollout correlation]
        external: the five component metrics individually
      analyzer:
        script: scripts/screening_mechanism_readout.py
        sha256: "97ecdf63be2306de7fdbf4fa1f7393a09f477b8a614450c30bc285d1027b7082"
        tests: tests/test_screening_mechanism_readout.py (12 tests)
        mechanism_probe_manifest: manifests/generated/mechanism_291_full.jsonl
        mechanism_probe_manifest_sha256: "2707e4593b54c620099359abd2e2799258fe920b34ff6217413eb65a95dbdcb1"
        mechanism_probe_builder: scripts/build_mechanism_291_manifest.py
        behavior_paired_noise_threshold: >-
          T_behavior = 0.1342752663136006, frozen 2026-09-01 by amendment
          behavior_paired_noise_threshold_freeze_20260901 from the Gate R1
          theta0 report (three seed sets 1701-1716 / 1801-1816 / 1901-1916)
          before any screening behavior readout
      trajectory_gates:
        step_20_50:
          probe: 34-row-pairable cheap probe (gate_r0 dev53 set)
          role: implementation/numeric-health/gradient-activation and early trajectory description only
          forbidden_stop_reasons:
            - "point estimate dd_swap <= 0"
            - "composition < 0.70"
            - "LCB95 < 0"
          reason: these checkpoints are under-powered by design
        step_174:
          probe: full 291-row mechanism set
          role: harm / clear-reversal stop ONLY; positive results do NOT trigger early success
          stop_conditions:
            - engineering health failure (NaN/Inf/OOM/checkpoint corruption)
            - format reward drop vs respective continued beyond the frozen 1pt NI bound
            - factual/replay non-inferiority failure (evaluated where rollout evals exist; enforced in full at step 348)
            - absolute factual-answer logp 95% CI clearly outside the frozen equivalence interval
            - both seed pairs negative point estimates AND pooled UCB95(DeltaDelta s_swap) < 0
            - DeltaDelta G_res again predominantly produced by -DeltaDelta s_null (LCB95(DeltaDelta G) > 0 with C_swap < 0.50)
        step_348:
          probe: full 291-row mechanism set; complete screening verdict
          mechanism_gate:
            - "m1 LCB95(dd_swap)>0 and both pair points >0"
            - "m2 composition >= 0.70 only if LCB95(dd_G)>0"
            - "m3 anchor equivalence CI inside [-0.02,+0.02]"
            - "m4 swap DCA not below theta0"
            - "m5 net neg->pos flips positive"
            - "m6 improvement reaches theta0-negative rows"
          behavior_gate: [both AReG seeds better than respective continued on G=16 rollout log-odds, ">= 2/3 evaluation seeds same direction", exceeds the Gate R1 frozen paired-noise threshold, TF-rollout correlation not degraded]
          fidelity_gate: [factual >= continued - 1pt, replay >= continued - 1pt, format >= continued - 1pt, anchor absolute logp inside equivalence interval, no completion-length or p(<think>) collapse]
          external_gate: M_ext primary macro; screening-to-expanded authorization does not hard-block on external; the final method-paper claim does
      flip_and_magnitude_tracking: >-
        per checkpoint per leg: d_i^flip = max(0, -s_swap,i); s_swap
        mean/median/p10/p25/p75/p90; median distance to zero; frac(s_swap>0);
        pos->neg / neg->pos / net flips; margin growth on theta0-positive
        rows; distance shrink on theta0-negative rows; predicted zero
        crossers at the current local slope.  Auxiliary readout only; the
        Goodhart branch is triggered by TF-score improvement without paired
        G=16 behavior improvement, NOT by any distance-percentage threshold
        (the proposed 20% rule is rejected as unsourced).
      continued_identical_g16: >-
        continued legs undergo the identical G=16 behavior evaluation as
        AReG legs, same harness, same eval seeds; otherwise AReG-vs-drift
        vs noise are indistinguishable.
      exposure_audit_contract: >-
        every 348-step run contract records: axis exposures, diagonal
        exposures, unique directional prompts, unique directional scenes,
        per-prompt repeat histogram, unseen prompts, replay unique
        prompts/scenes, and the AReG/continued schedule identity (the
        CycleOrderSampler is seed-independent by construction).  Correct
        description: one balanced exposure cycle over 174 directional
        slots (58 axis + 116 diagonal; axis prompts repeat, ~35 diagonal
        prompts may stay unvisited) + 174 replay slots -- NOT "each
        directional prompt exactly once".
      gate_power_precheck_permanent_rule:
        estimand: explicitly defined per gate
        unit: explicitly defined per gate
        cluster_unit: scene
        alpha: 0.05 one-sided
        target_power: 0.80
        sesoi: 0.005
        sesoi_unit: token-mean nats on the branch margin
        sesoi_rationale: >-
          ~3/4 of the killed objective's true 50-step swap component
          (+0.00668) and ~4x the 291-row single-model SEM (0.0012); the
          DeltaDelta SEM is recomputed scene-clustered at readout time and
          the requirement MDE80 <= SESOI is re-verified on it.
        requirement: MDE80 <= SESOI
      version_governance:
        rule: >-
          After this freeze: changing the objective, gamma, margins, data,
          primary endpoints, thresholds, or branch logic creates a new
          version AREG_V2_EXPLORATORY and may not be presented as a V1
          confirmatory result; pure implementation-bug fixes made WITHOUT
          viewing affected results keep confirmatory status via audit,
          versioning, and full rerun of the affected legs; checkpoint
          corruption / missing fields / hash mismatch is fail-closed with
          a full rerun of the affected leg; report-text-only corrections
          record a superseded report without voiding science results.
        paper_framing: >-
          The protocol is presented as "auditable stage-wise protocol
          freezing", not as a from-the-start immutable preregistration.
      four_branch_freeze:
        - "mechanism + behavior + fidelity + external all pass -> full GO: fresh-seed formal matrix"
        - "mechanism + behavior + fidelity pass, external zero/trend -> dose/coverage insufficient: launch the frozen expanded setting"
        - "TF mechanism pass but G=16 behavior flat -> TF-behavior Goodhart: think-prefix proxy first, then one minimal validation; do NOT expand data first"
        - "mechanism fail or fidelity fail -> objective still not fixed: no data expansion, no rollout-level switch; stop or restructure"
      superseded: >-
        The 2026-08-27 amendment's timeline.branch_A/B/C block and its
        fixed date table are superseded by this four-branch freeze and by
        event-dependency ordering (plan8 section 7); the expanded-setting
        launch_condition is narrowed accordingly (branch order: behavior
        flat routes to think-prefix, not to expansion).
      non_inferiority_note: >-
        Fidelity uses non-inferiority (LCB95(AReG - Cont) > -delta_NI,
        delta_NI = 1pt for factual/replay/format), NOT "not significant";
        anchor drift requires the CI fully inside the frozen equivalence
        interval [-0.02, +0.02] token-mean nats ("not significant" is not
        equivalence).
    evidence:
      - results/phase1/phase1_plan8.md
      - reports/generated/gate_r0_probe_readout.json
      - reports/generated/areg_gamma_calibration_readout.json
      - reports/generated/local_gamma_calibration_readout.json
      - tests/test_areg_autograd_paths.py
      - scripts/screening_mechanism_readout.py
      - manifests/generated/mechanism_291_full.freeze.json
      - records/EXPERIMENT_LOG.md (2026-08-28 entries)
