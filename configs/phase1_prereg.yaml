  - id: asymmetric_directional_credit_revision_20260826
    recorded_at: "2026-08-27T04:30:00Z"
    type: objective_function_revision_and_diagnostic_training_authorization
    changes_thresholds: true
    authority: results/phase1/phase1_plan7.md (revision R1, 2026-08-27)
    reason: >-
      The corrected mean-score 50-step E3 smoke stopped on the ninth
      preregistered hard gate (targeted_dev_metric_positive; 8/9 passed) and
      the STOP verdict is permanently retained. Row-paired decomposition of
      the frozen 291-row E3 artifacts shows the +0.0439 mean-unit G_res gain
      decomposes into +0.00668 (15.2%) from s_swap rising and +0.03719
      (84.8%) from s_null being pushed further down, with d_s_fact=-0.03753
      almost identical to d_s_null=-0.03719 and a net s_swap>0 flip count of
      -1: the symmetric DiD + null-pushing objective learned to suppress the
      mapped answer on non-swap inputs instead of steering swap inputs
      toward it. All six absolute answer log-probs sank by 0.078-0.118, an
      unmonitored failure mode. The objective form, not the pixel operator
      or the full-template proxy, is killed. Margin hyperparameters have
      also failed calibration twice (sum-score under-activation in E2, 0/20
      steps; mean-score over-activation in E3, 24/50 steps harvested by the
      null shortcut), so a permanent margin-binding precheck is instituted.
      This amendment freezes the replacement objective (AReG-CFPO), the
      known-confounder repairs applied symmetrically to all legs, the
      348-step diagnostic matrix, the gates, the evaluation-protocol
      changes, and the pre-frozen expanded setting as a launch-ready
      contingency.
    permanent_verdicts:
      E3_MEAN_SCORE_50STEP: STOP_IMMUTABLE
      ORIGINAL_DID_NULL_OBJECTIVE: KILL
      killed_objective_note: >-
        The regcfpo spec (symmetric DiD L_dir=[m-(s_swap-s_null)]+ plus
        null-pushing L_null=[m0+s_null]+, lambda_null=0.5) is retained in
        code and in prior frozen calibration records solely to reproduce
        historical runs; it may not be trained again.
    gradient_path_decomposition:
      verdict: RESOLVED_NULL_SHORTCUT
      artifact: reports/generated/e3_gradient_path_decomposition_v1.json
      artifact_sha256: "499ebb8778f890d71dddca947a78568a6867e10a2bd05108857237ecf1bb2393"
      script: scripts/gradient_path_decomposition.py
      reconciliation_report: reports/e3_gradient_path_reconciliation.md
      registered_frozen_endpoints: >-
        d_s_swap, d_s_null, d_s_fact, the net s_swap>0 flip count, and the
        six absolute log-prob deltas are registered as frozen endpoints
        consumed by the mechanism composition gate below.
    margin_binding_precheck:
      verdict: PASS
      artifact: reports/generated/margin_binding_precheck_areg_v1.json
      artifact_sha256: "2e5ef981b3c57ad703fd2ee0b8d7d05f7190d44c03472ac24d598b86164ee51d"
      script: scripts/margin_binding_precheck.py
      frozen_candidate_binding:
        absolute_arm_dominance: 0.511
        did_arm_dominance: 0.489
        l_swap_activation: 0.747
      percentile_method_note: >-
        Distribution percentiles use numpy method="lower" (floor index), the
        convention under which the plan7 R1 reference table reproduces; the
        pure-absolute-arm attainability columns and the composite-t_i
        activation columns are both archived and explicitly labeled.
      permanent_clause: >-
        Any future hinge/margin hyperparameter must, before being written
        into this prereg, produce a binding table on the theta0 frozen
        cohort: per-hinge activation, per-branch dominance of composite
        targets, attainability vs the current distribution, and explicit
        score-convention vs margin-unit reconciliation. Every loss component
        claimed active must bind on [10%, 95%] of samples; out-of-range
        components must be re-calibrated or explicitly demoted to
        report-only. No waiver is permitted on interpretability grounds.
    single_scientific_variable: >-
      Gradient routing of the directional credit: from symmetric DiD +
      null-pushing to null-detached, swap-only gradient with theta0 anchors.
      Attribution between AReG-CFPO and continued-GRPO rests on the control
      leg receiving the same confounder repairs.
    confounder_repairs_applied_to_all_legs:
      - "beta: 0.0 -> 0.01 (verified against vendor/SpatialLadder/VLM-R1/run_scripts/run_spld_stage1_2_cs_stage3.sh, which passes --beta 0.01; the project-local train_stage4.py default 0.0 was an undiscussed deviation)"
      - "directional:replay 1:0 -> 1:1"
      - "MIX credit: batch-mean normalization -> closed-form k/G table (batch-independent)"
      - "step budget 50 -> 348 (one full balanced cycle over 174 directional + 174 replay at one prompt group per step)"
      - "single seed -> two screening seeds {2001, 2002}; confirmatory seeds {3001, 3002, 3003} reserved and disjoint"
    not_introduced_this_round:
      - pixel context-matched null (parallel frozen diagnostic on viewed lineage only)
      - training pool expansion to 845 (pre-frozen below; launch-gated)
      - multiple prompt groups per optimizer step
      - think-prefix scoring (fallback option inside branch B, ahead of rollout-level)
    areg_cfpo_objective:
      name: AReG-CFPO (Asymmetric Relation-Grounded Counterfactual Policy Optimization)
      score_unit: total_nats
      score_unit_note: >-
        All auxiliary scores and margins are total nats over the 7-token
        full_template_span (s_tilde = 7 * s_mean). This is a deterministic
        linear rescale of the V3-validated proxy: rankings, signs, and gate
        correlations are unchanged; no proxy re-run was required.
      objective_registration: >-
        New registration areg_cfpo in src/regcfpo/training/objectives.py with
        branches (factual, swap, null) and forwards_per_group = 6; the
        killed regcfpo spec is left untouched for historical reproduction.
        E0.2 gamma=0 equivalence and E0.3 gate cases are re-run under the
        6-forward configuration before any training.
      per_sample_scores:
        s_swap: logp(mapped | I_swap) - logp(original | I_swap)
        s_null: logp(mapped | I_null) - logp(original | I_null)
        s_fact: logp(mapped | I_fact) - logp(original | I_fact)
      target: t_i = max(m_s, sg[s_null_i] + m_d)
      margins:
        m_s: 1.0
        m_d: 6.5
        margin_provenance: >-
          m_d = m_s - median_theta0[s_null] = 1.0 + 5.55, quantile-calibrated
          against the frozen 174-row cohort and validated by the margin
          binding precheck above (DiD-arm dominance 48.9%, L_swap activation
          74.7%, both inside [10%, 95%]).
      directional_loss: "L_swap = w_i * [t_i - s_swap_i]+  (null enters only through the detached target)"
      preservation_loss: >-
        L_pres = w_i * [ SmoothL1(s_null_i - s_null_i_0)
        + eta * SmoothL1(s_fact_i - s_fact_i_0)
        + eta_abs * SmoothL1(logp(y_i | I_fact) - logp_theta0(y_i | I_fact)) ]
      reference_values:
        fields: [s_fact_0, s_null_0, logp_fact_orig_0]
        source: runs/answer_proxy_gate_v3/answer_proxy_v3.jsonl (per-row, total nats; all 174 rows present, token_count 7)
        delivery: >-
          precomputed offline, written into the directional train manifest as
          three float columns; the merged manifest sha256 is bound into the
          run contract; zero extra forwards at training time
      total_loss: "L = L_GRPO + beta * KL(pi_theta || pi_theta0) + gamma * (L_swap + lambda_pres * L_pres)"
      beta: 0.01
      hyperparameter_calibration_rule: >-
        gamma, lambda_pres, eta, eta_abs are calibrated only on 20-step
        engineering runs so that ||gamma * grad L_aux|| / (||grad
        L_policy+KL|| + eps) falls in [0.10, 0.30]; with beta=0.01 the KL
        gradient is nonzero every step and the original plan6 loss-scale
        criterion applies; never tuned against dev accuracy.
      frozen_hyperparameters_20260828:
        protocol: >-
          20-step legs on the frozen 20-row calibration manifest (sha256
          3bd308aa35aee3fc339596dff01751abab847a666e40a6a3d4d4000d1f5cb1bb),
          beta=0.01, bs=4/G=4, seed 1234, gradient checkpointing, pinned
          GPU0, --reseed-per-step; quadrature readout
          scripts/areg_gamma_calibration_readout.py with branch-B
          record-and-degrade reward-parity semantics (E0.2 determination
          2026-08-28: stack-level bf16 non-determinism; both readouts PASS
          with confidence=degraded, reward drift steps recorded therein)
        areg_cfpo:
          ratio_at_gamma_1: 86.0873
          gamma: 0.00348
          lambda_pres: 1.0
          eta: 1.0
          eta_abs: 1.0
          note: gamma = 1.0 * 0.30/86.0873 (band upper edge, frozen
            historical convention), 3 significant figures
        local_non_directional:
          ratio_at_gamma_1: 8.2831
          gamma: 0.0362
          margin_dir_nats: 7.0
          note: gamma = 1.0 * 0.30/8.2831 (same convention)
        reports: >-
          reports/generated/areg_gamma_calibration_readout.json and
          reports/generated/local_gamma_calibration_readout.json
      mix_credit:
        definition: "closed-form k/G lookup, G=4: {0: 0.0, 1: 1.000, 2: 0.577, 3: 0.333, 4: 1.0 (SAT)}"
        equivalence_note: >-
          Equals max_j [A_ij]+ / sqrt(G-1) under population std (ddof=0);
          batch-independent by construction. gate.py group_accuracy_rewards
          keeps its deliberate ddof=1 mirroring of the vendored trainer
          advantage and is NOT used for credit.
        u_shape_decision: >-
          The credit is intentionally non-monotone in k with a discontinuity
          at k=G (informed choice, plan7 section 1 option 1): MIX credit
          derives from outcome-advantage strength while SAT credit marks a
          reliable factual answer with exhausted outcome signal; the two
          semantics are not on the same scale. The k=3 stratum is reported
          separately in the mechanism readout.
      first_class_monitors:
        logged_every_step:
          - six absolute log-probs (orig/mapped x factual/swap/null)
          - t_i branch dominance ratio (expected 40-60% DiD arm)
          - format reward
          - completion_length
          - p(<think>) at the first token after the generation prompt
        hard_stop: >-
          format reward drop vs theta0 exceeding 1 point within 348 steps
          stops the leg immediately
        think_less_teacher_forcing_risk: >-
          Registered limitation: auxiliary branches teacher-force
          "<answer> X </answer>" directly after the generation prompt with
          no <think> block, a continuation that never occurs in real
          rollouts. Monitored as above; the fallback remedy (score the
          answer span after a canonical or self-sampled think prefix,
          requiring one proxy consistency re-run) is staged in branch B
          ahead of any rollout-level switch.
    diagnostic_training_348step:
      authorization_scope: OBJECTIVE_V2_DIAGNOSTIC_AUTHORIZED only; FORMAL_TRAINING_AUTHORIZED remains false
      data:
        directional: {prompts: 174, scenes: 76}
        replay: {prompts: 174, scenes: 143}
        ratio: "1:1"
        steps: 348
        steps_meaning: one full balanced cycle; each directional and replay prompt covered once in expectation
        merged_manifest_rule: >-
          the directional+replay merged manifest (with the three reference
          columns on directional rows and aux weight 0 on replay rows) is
          produced by a versioned script with lineage assertions, and its
          sha256 is bound into the run contract before Gate R0
        merged_manifest: manifests/v3_final/v3_areg_train_348.jsonl
        merged_manifest_sha256: "3ea0b265ef41afe165e7083c4eb17562d1b90e8af2a356fed7f268654a99bc20"
        merged_manifest_freeze_record: manifests/v3_final/v3_areg_train_348.freeze.json
        merged_manifest_builder: scripts/build_areg_train_manifest.py
      sampling:
        axis_to_diagonal: "1:2"
        scene_uniform: true
        diagonal_family_alternation: "1:1"
        replay_buckets: frozen four-bucket rule of final_split_configuration
        exposure_rule: >-
          deterministic exposure schedule; every manifest row is visited
          exactly once per cycle (the vendored RepeatRandomSampler cannot
          provide this and is replaced via the trainer_class instrumentation
          seam). Single-cycle note: with 23 axis vs 151 diagonal rows the
          axis:diagonal 1:2 motif is arithmetically impossible under
          full single-cycle coverage; the frozen schedule applies the
          [axis, diagonal, diagonal] triplet motif greedily over the first
          69 directional slots followed by a diagonal-only tail, with 1:1
          family alternation where supply allows (deviation documented in
          manifests/v3_final/v3_areg_train_348.audit.json)
        gate_r0_probe_manifest: manifests/generated/gate_r0_probe_dev53.jsonl
        gate_r0_probe_manifest_sha256: "b7e8cf8cd9178d97a660648e2629041c711c0b7823c935de5384d4ccd0b3ea14"
      optimization: {group_size: 4, per_device_batch: 4, lr: 1.0e-6, schedule: linear, beta: 0.01}
      checkpoints:
        probe_steps: [20, 50, 174, 348]
        retention: >-
          step-20/50/174 snapshots are weights-only probes deleted after
          readout; full checkpoints kept only for step-20 (resume) and final
      screening_matrix:
        continued_grpo_replay_kl: {seeds: [2001, 2002], steps: 348}
        areg_cfpo: {seeds: [2001, 2002], steps: 348}
        local_non_directional: {seeds: [2001], steps: 348, margin_conversion: "7.0 nats", gamma: 0.0362}  # frozen 2026-08-28 by rule, see frozen_hyperparameters_20260828
        mechanism_trajectory_saved_at: [20, 50, 174, 348]
        screening_seed_policy: screening seeds are never counted toward the confirmatory three seeds {3001, 3002, 3003}
    gates:
      gate_r0_gradient_direction_probe:
        timing: before any 348-step launch (2026-08-28/29)
        protocol: >-
          frozen stratified 20-row train-only manifest; measured after a
          fixed 20 updates on a scene-disjoint fixed probe set
          (data/processed/relation_pair_v2_development.jsonl, 53 rows);
          no accuracy is inspected
        pass_criteria:
          - d_s_swap > 0 and accounts for >= 70% of d_G
          - "|d_s_null| clearly smaller than d_s_swap"
          - "|d_s_fact| near 0"
          - null/factual anchor gradient directions as expected
          - valid swap gradient present in both SAT and MIX groups
          - six absolute log-prob drifts recorded and bounded; logp(y|I_fact) must not decline systematically
          - t_i DiD-arm dominance inside 40-60% (precheck prediction interval)
          - no NaN, format degradation, p(<think>) degradation, or memory anomaly
        fail_action: stop immediately; do not run the full cycle
      gate_r1_behavior_noise_floor:
        redesigned: true
        redesign_reason: >-
          A Goodhart test on the old ReG-50 checkpoint has no discriminative
          power because its TF margin never moved (d_s_swap=+0.00668 mean
          units); behavior stasis there is a foregone conclusion, not
          evidence of Goodharting.
        protocol: >-
          Base model, same 4090 and same eval code; all 174 directional
          rows, swap/null branches at G=16, >= 3 fixed rollout seeds
          (sets 1801-1816 and 1901-1916 extending the existing 1701-1716);
          report mapped-majority rate, Var_seed and seed range of rollout
          log-odds, and seed-to-seed fluctuation of TF-rollout correlation.
        role: provides the comparison scale for the behavior gate; holds NO route-fork authority (forks are decided on 2026-09-01)
        archival_addon: >-
          G=16 behavior data for the old ReG-50 / Local-50 checkpoints are
          collected in the same batch as formal evidence of zero behavioral
          progress under the killed objective; never used prospectively.
      hard_gates_348step:
        mechanism_composition_gate:
          - scene-bootstrap LCB95(d_s_swap) > 0
          - d_s_swap / (|d_s_swap| + |d_s_null|) >= 0.70
          - factual anchor drift not significant
          - null anchor drift not significant
          - swap DCA improved
          - net positive flip count increase (not merely margin widening on already-positive rows)
        behavior_gate:
          - G=16 mapped-majority or rollout log-odds better than respective continued for both training seeds
          - at least 2/3 evaluation seeds same-sign
          - TF-rollout correlation not degraded
        real_task_gate:
          - at least one real metric not defined by the training operator: 3-eval-seed mean positive, >= 2/3 seeds same direction
          - factual/replay mean degradation <= 1 point
          - external targeted spatial benchmark shows a positive trend
        confirmation_291_role: demoted to mechanism diagnostic; no longer the primary accuracy Go/Stop set (257/291 SAT, no headroom)
    evaluation_protocol_changes:
      primary_estimator: scene-weighted paired estimator; row-weighted means descriptive only
      multi_seed_rule: 3-seed mean positive AND >= 2/3 seeds same direction replaces any single-seed point estimate
      composition_gate_required: true
      strict_null_retention_required: true
      w2_semantic_changes_registered:
        - closed-form batch-independent MIX credit (above)
        - >-
          training authorization is three-tier: smoke (<=50 steps,
          TRAINING_SMOKE_AUTHORIZED), diagnostic (51-348 steps without
          --formal, OBJECTIVE_V2_DIAGNOSTIC_AUTHORIZED), formal (--formal
          or >348 steps, FORMAL_TRAINING_AUTHORIZED)
        - save_total_limit raised 1 -> 2
        - train-side answer parser aligned with the eval-side trailing-period tolerance
        - format reward single-sourced to audit.stage3_format_valid
        - integer-rounded box mutual-exclusion reject reason integer_box_overlap added
      superseded_hash_policies:
        - >-
          v3_contract_hardening.frozen_hash_policy ("pixel_ops.base_eligibility
          hash stays untouched") and the matching freeze clause in
          results/phase1/phase1_plan4.md are superseded under plan7 section 11:
          base_eligibility gained the integer-rounded mutual-exclusion reject
          reason integer_box_overlap (mirrored in src/regcfpo/eligibility.py to
          keep the data-layer/operator-layer no-drift invariant). New code
          hashes: pixel_ops.py sha256
          ad69c2cab162e7fe24085214aecc76aece018ecc41303d22349e6f0b9865538a;
          eligibility.py sha256
          b9bea77681360801e0e4a24d97b223072670b2ba5dc3bbe40e7e6b8b6068d463.
          Empirically zero of the 1843 v3 candidate rows and 174 directional
          train rows change eligibility; old run contracts are unaffected and
          resume fail-closed by design.
    expanded_setting_preregistration:
      status: FROZEN_NOT_EXECUTED
      manifest: manifests/v3_final/v3_directional_train_expanded.jsonl
      manifest_sha256: "b34b82d6e5b53c8414411c1d11d6465fe4aa0e62cd8c5ab35e67540a02ae0082"
      freeze_record: manifests/v3_final/v3_expanded_setting_freeze.json
      freeze_record_sha256: "5d6e14ccff7c57bfe692fd5da93b6b3a0b2e5baf4ae6e12e73c36b86fd31e7cb"
      audit: manifests/v3_final/v3_directional_train_expanded.audit.json
      composition: {prompts: 845, scenes: 212, axis: 359, diagonal: 486, sources: "174 unseen clean (76 scenes) + 671 viewed eligible (136 scenes)"}
      hyperparameters: verbatim copy of the clean-setting frozen values above; no re-calibration permitted
      step_rule: one full balanced cycle over the expanded mix including replay repetitions
      evaluation_rule: external benchmarks plus the 8-scene final holdout ONLY; no viewed internal scene may appear in any post-training evaluation path (the internal viewed eval sets are consumed by the merge)
      launch_condition: >-
