  - id: behavior_eval_seed_group_mapping_20260901
    recorded_at: "2026-09-01T04:57:30Z"
    kind: operational_pinning
    scope: >-
      screening_348 behavior gate: expansion of the frozen evaluation_seeds
      [1701, 1702, 1703] into G=16 rollout groups on the V3-code-path harness
      (scripts/behavior_noise_floor_r1.py, one completion per seed).
    pinning: >-
      Each frozen evaluation seed e in {1701, 1702, 1703} anchors a G=16
      rollout group with the deterministic seed list [e + 1000*j for j in
      0..15], i.e.  group 1701 = {1701, 2701, ..., 15701}, group 1702 =
      {1702, 2702, ..., 15702}, group 1703 = {1703, 2703, ..., 15703}.  The
      three groups are pairwise disjoint, each has exactly 16 seeds, and the
      frozen seed numbers are used verbatim as group anchors.  The per-group
      statistic (per-row rollout log-odds log((n(y_cf)+0.5)/(n(y)+0.5)),
      swap branch, all 174 directional rows) is computed per group; the
      ">= 2/3 evaluation seeds same direction" condition is evaluated on the
      three groups; the threshold comparison uses the average of the three
      group-level paired AReG-minus-continued scene-weighted means, per
      amendment behavior_paired_noise_threshold_freeze_20260901.
    rationale: >-
      The A++ freeze fixed the three evaluation seed identities but did not
      specify how one evaluation seed yields G=16 rollouts on a
      one-completion-per-seed harness (the Gate R1 anchor+consecutive
      pattern 1701-1716 cannot be applied verbatim to 1702/1703 without
      overlapping groups).  This pinning resolves that operational gap only;
      it does not change any seed identity, endpoint, threshold, estimator,
      or branch logic, and is made BEFORE any screening behavior evaluation
      has been run or viewed.  AREG_V1 confirmatory status is unaffected.
    evidence:
