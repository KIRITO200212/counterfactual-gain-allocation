    - relation_family
    - eligible_prompt_count
    - axis_or_diagonal
    - token_support
    - box_size_ratio
    - union_area
  model_outputs_used: false
  constraints:
    final_internal_holdout_scenes_min: 8
    final_internal_holdout_scenes_target: 10
    final_internal_holdout_eligible_prompts_min: 30
    final_internal_holdout_eligible_prompts_target: 40
    holdout_covers_axis_and_diagonal: true
    holdout_covers_support_strata: true
  released_to_train_pool: remaining unviewed reserve scenes
  algorithm: deterministic greedy or integer program with frozen seed; hash frozen

saturation_audit_two_report_design:
  status: preregistered
  runs:
    training_distribution:
      population: final directional training prompts
      purpose: difficulty/stratum labels for sampler and saturation-aware gate
      leakage_status: none (training-sample stratum annotation)
    confirmation_distribution:
      population: the 291 operator-confirmation eligible prompts
      purpose: off-training saturation replication on never-trained scenes
  config: G=4, official generation config, fixed generation seeds, accuracy and format rewards separated
  reporting: SAT rates must be reported separately per distribution, never pooled

training_hyperparameter_calibration:
  status: CORRECTED_MEAN_SCORE_CALIBRATION_FROZEN
  provenance:
    margins_m_m0: >-
      1.0 in log-odds units (one nat of likelihood ratio between mapped and
      original / null-violation anchor); scale consistent with the observed
      G_res magnitudes (+4.3 axis confirmation, +4.9 train-directional)
    weight_clip: 4.0 per plan.md section 1.1
    epsilon: 1e-6 per plan.md section 1.1
    gamma_lambda_null: >-
      Corrected mean-score calibration frozen 2026-08-26 using engineering
      gradients only: ReG gamma=0.0176 with lambda_null=0.5; local
      non-directional gamma=0.0104 with lambda_null=0.  Both values target an
      auxiliary/policy pre-clip gradient ratio of about 0.30.  The historical
      sum-score gamma=0.005 is superseded and remains provenance only.
  calibration_plan:
    - engineering smoke logs L_dir, L_null, GRPO policy loss, w_tilde mean,
      clip-hit fraction, and auxiliary forward counts at every step
    - gamma initialized so the auxiliary mass is 10-30 percent of the
      per-token GRPO objective at step 0
    - lambda_null initialized at 0.5 and coarsely swept only on the 5-20
      step engineering runs
    - final gamma/lambda frozen before the 50-step scientific smoke and
      never tuned against dev accuracy
  calibration_outcome: >-
    FROZEN 2026-08-26 before corrected 50-step training.  A deterministic
    train-only 20-row calibration manifest (8 SAT, 8 MIX, 4 ALL_WRONG; no dev
    accuracy) produced policy gradients on 2/20 steps.  At gamma=1, ReG and
    local auxiliary/policy ratios were 17.0848 and 28.7542; the frozen values
    gamma_reg=0.0176 and gamma_local=0.0104 map them to about 0.30.
    lambda_null=0.5 for ReG, m=m0=1.0, uniform family scheduling,
    directional:replay=1:0, checkpoint selection=final, train seed=1234 and
    the existing frozen evaluation seeds remain unchanged.  Reports:
    runs/phase1_score_mean_v2_4090/e2_stratified/*_calibration_readout.json.
  c_loc_c_op_policy: >-
    caller premultiplies locator confidence and operator reliability into the
    raw gate credits; for the GT-box Stage-4 configuration both are 1.0

answer_proxy_gate_v2:
  source_lineage: viewed development/confirmation rows only (no new scenes)
  sample_size_target: 200
  comparison_arms:
