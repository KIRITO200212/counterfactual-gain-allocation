  main: pixel_pair_slot_swap
  null_1: canonical_resampling_return
  null_2: genuine_irrelevant_pair_swap
  controls: [compact_pair_hflip, compact_pair_vflip_same_support_control]
  canonical_noop: canonical_noop
  support_definition: union of the A and B object boxes in pixels
  scope: pure left/right only; diagonal relations require a separate audit
  gate_statistics:
    g_res: s(I_swap) - s(I_resampling) on mutually accepted eligible samples
    g_robust: >-
      s(I_swap) - max(s(I_resampling), s(I_irrelevant)) on samples accepted
      by all three branches
  progression_requirements: results/phase1/phase1_plan.md section 6.3

