amendments:
  - id: loss_aligned_proxy_amendment_20260822
    recorded_at: "2026-08-22T06:30:00Z"
    type: proxy_gate_metric_clarification_and_prospective_confirmation
    changes_thresholds: true
    authority: results/phase1/phase1_plan5.md
    reason: >-
      User decision A-prime: metric-clarification amendment plus a new G=16
      prospective confirmation, instead of post-hoc acceptance of the
      answer-only arm. ANSWER_PROXY_GATE_V2=FAIL is permanently retained
      (artifact reports/generated/gate_readout_answer_proxy_v2.json,
      schema_version 2 with midrank Spearman): the
      preregistered rho>=0.80 four-candidate Spearman criterion is
      ceiling-limited under G=4 references (with one-hot-with-ties frequency
      vectors the maximum attainable midrank Spearman is 3/sqrt(15) =
      sqrt(3/5), about 0.7746; notation corrected from the original
      "sqrt(3/15)" typo on 2026-08-22, value unchanged), so it is recorded
      as CEILING_LIMITED / NOT VALIDLY ESTIMABLE
      rather than a method failure, and the swap-branch sign shortfall
      (0.845 vs 0.85) is driven by rollout-reference tie rows that carry no
      directional signal. The new LOSS_ALIGNED_PROXY_GATE_V3 re-targets the
      gate at what the auxiliary loss actually consumes - the two-candidate
      mapped-vs-original log-odds fidelity - and is frozen in full BEFORE the
      G=16 run starts; if V3 fails, no metric or threshold may be modified
      again. The four-candidate Spearman survives only as descriptive
      distribution-fidelity reporting (raw, empirical ceiling,
      ceiling-normalized, top-1-in-rollout-argmax-set). full_option_text is
      retired as a formal candidate arm and kept only as historical record.
    v2_permanent_record:
      gate: ANSWER_PROXY_GATE_V2
      status: FAIL
      artifact: reports/generated/gate_readout_answer_proxy_v2.json
      superseded_artifact: reports/generated/gate_readout_answer_proxy.json
      invalidated_first_run: runs/invalidated_answer_proxy_rollout_counting_bug/
      four_candidate_spearman_criterion: CEILING_LIMITED_NOT_VALIDLY_ESTIMABLE
      note: >-
        The V2 failure is preserved as written; no retrospective relabeling.
        Tie-aware reanalysis and midrank Spearman recomputation are descriptive
        sensitivity evidence only and do not alter the V2 verdict.
    loss_aligned_proxy_gate_v3:
      status: PASS
      status_corrected_20260827: true
      cohort:
        manifest: manifests/v3_final/v3_directional_train.jsonl
        rows: 174
        scenes: 76
        composition: axis 23 + diagonal 151
        rationale: >-
          The frozen directional train cohort is the exact distribution the
          proxy will serve; scoring-method validation on train data is not
          test leakage; the 8-scene final holdout stays untouched; the viewed
          200-row proxy cohort is not reused as the confirmation set because
          the new metric design was informed by its results.
      rollout_reference:
        branches: [pixel_pair_slot_swap, canonical_resampling_return]
        num_generations: 16
        seeds: [1701, 1702, 1703, 1704, 1705, 1706, 1707, 1708, 1709, 1710,
                1711, 1712, 1713, 1714, 1715, 1716]
        generation_config: >-
          official Stage-3 identity (temperature 1.0, top_p 1.0, top_k 50,
          repetition_penalty 1.0, do_sample true, max_new_tokens 1024)
        prompt: official CoT template, byte-identical to the saturation audit path
        factual_branch: >-
          reuses the dual-cohort saturation G=4 results for the same 174
          prompts only after per-row byte-identity verification of prompt and
          generation contract; if any row mismatches, the factual branch is
          regenerated at the same G, never approximately reused
        smoothed_log_odds: "Delta_rollout = log((n(y_cf) + 0.5) / (n(y) + 0.5))"
        sign_correction: >-
          plan5 section 3.3 originally wrote the ratio inverted; the frozen
          definition maps higher n(y_cf) to positive Delta_rollout, matching
          Delta_proxy = logp(y_cf) - logp(y)
      proxy_scores:
        definition: "Delta_proxy = logp(y_cf) - logp(y)"
        arms: [answer_only, full_template_span]
        retired_arms: [full_option_text]
      gates:
        A_completion: >-
          answered_fraction >= 0.95 per newly generated branch; format success
          and truncation reported separately
        B_factual_fidelity: factual top-1 agreement >= 0.90
        C_tie_aware_directional: >-
          conditional on Delta_rollout != 0: swap >= 0.90 and null >= 0.95;
          tie rows (exactly equal n(y_cf) and n(y)) are always reported
          separately (swap/null tie rates, proxy |delta| on tie vs non-tie
          rows), never silently dropped
        D_loss_aligned_correlation: >-
          primary gate on the swap branch: scene-aggregated Spearman - average
          Delta_proxy and Delta_rollout within each scene, then Spearman over
          the 76 scene-level points - must be >= 0.80, AND its scene bootstrap
          (resample scenes with replacement, re-aggregate, percentile method)
          LCB95 must be > 0.70; the row-level Spearman is descriptive only;
          the null branch is not gated on correlation (its reference delta is
          near-constant) and is judged by gate C plus factual-answer retention
        E_four_candidate_spearman: >-
          descriptive only (raw, empirical ceiling, ceiling-normalized,
          top-1-in-rollout-argmax-set); does not decide training authorization
      stratification: >-
        frozen as overall, axis, diagonal, LF_RB, LB_RF; overall is the primary
        criterion; no relation family may show a reversed direction; axis
        (n=23) is reported standalone (sign, tie rate, correlation) without a
        bootstrap LCB requirement
      arm_selection_rule: >-
        frozen before viewing G=16 results: if full_template_span passes V3,
        the training proxy is full_template_span and answer_only becomes an
        efficiency ablation; elif full_template_span fails and answer_only
        passes, the training proxy is answer_only; else STOP. Numerical
        superiority observed after viewing results may not override this
        priority.
      failure_rule: no further metric or threshold modification after a V3 failure
      holdout_rule: the 8-scene final holdout remains completely unseen
      parallel_work: >-
        during the G=16 run, static trainer vendor integration, the training
        environment build, and equivalence-test authoring may proceed, but no
        optimizer step is run and all training authorizations stay false
    evidence:
      - results/phase1/phase1_plan5.md
      - reports/generated/gate_readout_answer_proxy_v2.json
      - reports/answer_proxy_gate_decision.md
